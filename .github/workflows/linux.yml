# Builds the tree on Linux, runs the whole ctest suite against testdata/, and
# packages the GTK app as a .deb.
#
#   gcc     — the reference Linux build (README "Build > Linux"): every module, the
#             Python bindings and the GTK app, tests under xvfb-run. Builds the
#             .deb, installs it and runs the installed app once.
#   clang   — the shared code only (no gtkmm installed, so the GTK app configures
#             itself out), built with clang to catch portability breaks that the
#             macOS and iOS builds, both clang, would otherwise hit first.
#   release — on a tag v<version>, attaches the tested .deb to a GitHub Release.
name: Linux

on:
  push:
    branches: [main, "linux/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc, full tree with GTK app
            id: gcc
            cc: gcc
            cxx: g++
            packages: libgtkmm-4.0-dev dpkg-dev
            package: true
          - name: clang, shared code only
            id: clang
            cc: clang
            cxx: clang++
            packages: clang
            package: false
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git ccache \
            libsqlite3-dev xvfb xauth fonts-dejavu-core \
            python3-dev python3-numpy python3-pytest python3-tk \
            ${{ matrix.packages }}

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.id }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.id }}-

      # A tag v1.2.0 packages as 1.2.0 and v1.2.0-rc1 as 1.2.0~rc1, which dpkg
      # sorts below 1.2.0; anything else as 0.0.0~ci<run>+g<sha>, below every
      # release.
      - name: Package version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            version="${version//-/\~}"
          else
            version="0.0.0~ci${GITHUB_RUN_NUMBER}+g${GITHUB_SHA::7}"
          fi
          echo "PEREGRINE_VERSION=$version" >> "$GITHUB_ENV"

      # PYTHON_EXECUTABLE pins the bindings to the interpreter apt installed
      # NumPy, pytest and Tk into, not a runner tool-cache Python on the PATH.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPYTHON_EXECUTABLE=/usr/bin/python3 \
            -DPEREGRINE_VERSION="$PEREGRINE_VERSION"

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build -j "$(nproc)"
          ccache --show-stats

      # xvfb-run gives the Tk tests of the Python app a display; without it they
      # skip. ctest counts a skip as a pass, so the summary reports skips too.
      - name: Test
        run: |
          set -o pipefail
          xvfb-run -a ctest --test-dir build -j "$(nproc)" --output-on-failure \
            --output-junit "${{ github.workspace }}/ctest-junit.xml" \
            | tee ctest.log

      - name: Summarize
        if: always()
        run: |
          [ -f ctest.log ] || exit 0
          {
            echo "### ${{ matrix.name }}"
            grep -E 'tests passed|Total Test time' ctest.log || true
            echo
            echo "Skipped: $(grep -c '(Skipped)' ctest.log || true)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.id }}
          path: |
            ctest.log
            ctest-junit.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      - name: Build the .deb
        if: matrix.package
        run: |
          (cd build && cpack --config CPackConfig.cmake)
          mkdir -p dist && mv build/peregrine_*.deb dist/
          ls -l dist

      # Installs the package the way a user would and opens the installed app
      # once, with nothing from the build tree on hand.
      - name: Install and run the .deb
        if: matrix.package
        run: |
          sudo apt-get install -y ./dist/peregrine_*.deb
          dpkg -L peregrine | grep -q /usr/share/peregrine/geotrans/egm96.grd
          XDG_CONFIG_HOME="$RUNNER_TEMP/config" GSK_RENDERER=cairo \
            xvfb-run -a peregrine-gtk --shot "$RUNNER_TEMP/installed.png"
          test -s "$RUNNER_TEMP/installed.png"

      - name: Upload the .deb
        if: matrix.package
        uses: actions/upload-artifact@v4
        with:
          name: peregrine-deb
          path: dist/peregrine_*.deb
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: peregrine-deb
          path: dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/peregrine_*.deb \
            --title "Peregrine $GITHUB_REF_NAME" --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
