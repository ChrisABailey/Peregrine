# Pippin — the bundled settings file (fv::Settings), Pippin plan P1.
#
# EVERY PATH IN HERE IS BUNDLE-RELATIVE, resolved by PippinKit against the
# app bundle's Data/ directory. Nothing in this file names a path on any
# particular machine, because the file ships inside the .app: an absolute
# path would be a path that exists on exactly one computer and on no phone.
#
# The pack this file describes is staged by `port/apps/Pippin/stage_data.py`
# and is git-ignored — it is a few MB of build artifacts cut out of
# testdata/, not source. See README.md.
#
# Keys under [osm], [routing], [movingmap] and [points] are the port's own,
# documented in port/peregrine.ini.sample. Keys under [pippin], [pick] and
# [search] are the app's, and are documented here because here is the only
# place they are read.

[pippin]
# The offline vector pyramid, cut from us-south.mbtiles by
# port/tools/mbtiles_cut.py. Catalogued as a data source at startup rather
# than opened by a settings key, which is how every pyramid is opened — but
# the app has to be TOLD which file to catalogue, and on a phone there is no
# File > Add Map Data to tell it with.
mbtiles = "kiawah.mbtiles"

# Where the map opens (requirement: "opens on Kiawah"), and the box GPS
# mode's zoom-out rule (P7) treats as the data's own extent. Written as
# west,south,east,north — the order MBTiles' metadata.bounds uses, and the
# same numbers mbtiles_cut.py was given.
home_bounds = "-80.17,32.55,-79.97,32.67"

# The label font. CpuCanvas::SetDefaultFont wants a TTF on the filesystem,
# and iOS gives an app no readable path to a system face — so the pack
# carries its own. DejaVu Sans, under the Bitstream Vera licence, which
# permits redistribution as long as the notice travels with it — so
# `fonts/LICENSE_DEJAVU` is staged beside it and is not optional. The file
# keeps its own name deliberately: renaming a font is the one thing that
# licence has an opinion about.
font = "fonts/DejaVuSans.ttf"

[points]
# The point overlay (P9), and the button beside Route that switches it on.
#
# Both keys here are APP STARTUP STATE and neither is in the document: a
# `.fvpoints` file is a set of places, not a record of whether somebody had
# them switched on. `PPPointStore` says the same thing where the two are
# separated.
visible = true

# Names beside the markers. OFF is fvkit's own default, for the reason the
# ledger carries — there is no label collision, so a dense set draws names
# over each other. Pippin's set is a couple of dozen places on one island and
# a name is what makes a marker worth tapping, so it is on here.
show_labels = true

# How far from a marker a tap still counts, in iOS POINTS. It is ADDED to the
# marker's own drawn half-width, so a 22-pt marker is pressable 11 + 22 = 33
# points from its centre — Apple's 44-point target, arrived at honestly. A
# thumb is about 22 points across; this is that, and not a mouse's 8 px.
hit_tolerance = 22

# The set the pack ships. It is COPIED into Documents/points.fvpoints on the
# first launch and never read again — from that moment the user's edits ARE
# the document, and an app update cannot revert them.
seed = "kiawah.fvpoints"

[pick]
# HOW FAR BEYOND A FEATURE'S OWN INK the crosshair still snaps to it, in iOS
# POINTS. 0 turns snapping off.
#
# IT IS A MARGIN, NOT THE WHOLE REACH. The marker's drawn half-width is added
# to it first, so a 26-point marker is caught from about 13 + 12 = 25 points
# out — roughly when the crosshair's ring touches it, which is what the
# requirement's word *overlaps* means.
#
# NARROWER THAN `points.hit_tolerance` (22), which is the opposite of the first
# guess and was corrected on the simulator: at 30 the crosshair snapped to a
# marker sitting plainly beside it. A tap can afford more because a FINGERTIP
# is the blunt instrument; here the rider is steering the map under a crosshair
# they can place exactly, and an eager catch reads as the app picking wrong.
#
# ANY overlay that implements the snap capability is a source — the points and
# the route's waypoints today — so this one number governs all of them.
snap_tolerance = 12

[search]
# FINDING THINGS BY NAME (P20). The route dialog opens on a search box, and
# every stop's "..." menu carries one. What is asked is `fv::app::SearchSession`
# over the WHOLE overlay stack — the rider's points, the chart's named
# features and the routing graph — so one query answers with all three and
# they are ranked against each other once. The query itself carries NO AREA:
# see `chart_in_view_only` below for which provider is windowed and why it is
# the only one.

# THE POINTS DOCUMENT AND THE ROAD NETWORK ARE ALWAYS SEARCHED WHOLE, not just
# the part on screen, and there is no key for that because there is no reason
# to want one: a `.fvpoints` file is a few dozen rows, and the road graph tests
# each DISTINCT NAME once against its own name table, so both answer over the
# whole island for nothing.
#
# THE CHART IS THE ONE THAT CANNOT. A text query with no area and no name index
# reads no tiles and finds nothing, so the chart is lent the VIEWPORT as a
# window to look through — lent to it alone, rather than put on the query,
# where it would also have cut the two providers that never needed it.
#
# This key is whether it gets that window. Deliberately not a control in the
# app: a desktop's Find box offers "This view only" because a desktop user is
# exploring a pack, and a rider planning a route wants what is near them
# without being asked about scope first. It lives here so it can be tested.
#
# TURNING IT OFF DOES LESS THAN IT LOOKS LIKE IT SHOULD. With no window and no
# index the chart contributes NOTHING, and the answers are the points and the
# roads. With an INDEXED pack (`fvnames build`,
# port/search-plan-COMPLETE.md tier 2) the key is already ignored — tier 2
# answers globally before the window is reached, because an index makes the
# chart one of the providers that can afford the whole world.
chart_in_view_only = true

# The most rows one search returns. It caps each provider as well as the
# total, which is the seam's own contract: the point of the number is that
# nobody builds the bigger list in the first place.
max_results = 40

# HOW NEAR TWO ROWS OF THE SAME NAME AND KIND HAVE TO BE before the second is
# dropped as the same thing found twice. The chart and the road graph both
# answer "Ruddy Turnstone" — they are two recordings of one street — and two
# identical rows on a list a thumb is scrolling is a list that looks broken.
#
# IT IS THE FALLBACK TEST AND NOT THE MAIN ONE. Two rows whose BOUNDS overlap
# are one thing whatever this says, which is what catches a long road the two
# providers anchor kilometres apart; this number is what settles two points,
# whose bounds are degenerate and can never overlap. 0 leaves only the bounds
# test. See PPSearchRules.h.
duplicate_radius_m = 250

# WHAT THE BOX OPENS ON before anybody has searched anything. After that it
# opens on whatever was last searched for successfully, which is remembered per
# INSTALL (a UserDefault) and not here — this is the seed, and it is in the pack
# because the right one is a fact about the pack. On Kiawah it is the numbered
# beach boardwalks, which are in the road graph, are spread along the whole
# island, and are the thing a rider most often wants to get to.
#
# Empty opens on an empty box.
initial_text = "Boardwalk"

# CHOOSING A RESULT MOVES THE MAP TO IT, behind the sheet. These two shape
# that move.
#
# `frame_min_scale` is the scale it will never go IN past. A forty-metre
# cul-de-sac fitted exactly to a phone is about 1:300 — a street with no map
# around it — so the fit stops at the scale a rider actually reads a street
# at. 0 asks for no floor and lets the arithmetic stand.
frame_min_scale = 2500

# `frame_top_bias` is how far UP the screen the result is pushed, as a
# fraction of the height. It exists because the sheet that asked the question
# is still up when the map moves: a result centred exactly is a result
# underneath the dialog. It is allowed for in the FIT as well as in the pan,
# so a road pushed up the screen does not end up half off the top of it.
frame_top_bias = 0.18

[osm]
# The look. CyclOSM (port/Osm/styles/style.json), which is the one tuned for
# riding: it draws cycleways, footways and tracks as their own dashes rather
# than folding them into "path", and gives surface and access their own
# colours — the distinctions that decide a route on a gated island.
#
# It DOES declare a sprite sheet, `symbols/osm-liberty-topo`, and that value
# is relative to the style file, which in the pack is the pack root — so the
# sheet is staged as symbols/osm-liberty-topo.{png,json} and stage_data.py
# checks for the pair. The style's `glyphs` is a {{ }} template and is
# ignored: labels come from pippin.font, not from a glyph server.
style = "style.json"

# peregrine-osm.json is also in the pack — the plainer look, and the name
# PPMap falls back to if this key ever goes missing. Swap this key to try it.

[routing]
# The road graph, built from the four Kiawah extracts HONOURING access
# (never --ignore-access): on a gated island access=private IS the street
# network, and it is priced rather than deleted.
graph = "kiawah.fvroad"

# The cost rules, so `walk` and `cycle` in the route sheet are the rule
# file's `foot` and `bicycle` profiles rather than compiled-in constants.
# The file is reread on an mtime poll, which on a phone means never — it is
# read once from a read-only bundle and that is the whole of it.
rules = "route-weights.json"
profile = "bicycle"

# P11 — how far the pick button looks for something to name.
#
# ~50 m is the honest number for a crosshair a rider aimed BY EYE, and it is
# deliberately not the snapper's `max_radius_m`: 60 m there is a GPS error
# budget, and this is a thumb. It wants its own key because the right value
# differs between an island of cul-de-sacs and a city grid — on Kiawah 50 m
# reaches the cycleway from the middle of the parkway, which is the case the
# whole feature is about.
pick_radius_m = 50

# And how much nearer a DIFFERENT road has to be before the button changes its
# mind. At a junction, or on a road with a cycleway beside it, the two nearest
# roads are metres apart and the nearest one flips as the map drifts a pixel —
# so the road named last is kept while it stays within this margin, and the
# button does not blink while it is being read. The snapper's own
# `stay_bonus_m` idea, applied to a label.
pick_stay_bonus_m = 10

# P21 — DRAGGING A ROUTE POINT. Hold a waypoint down, move it, let go.

# How far beyond a waypoint's own drawn ink a press still grabs it, in iOS
# POINTS. Added to the diamond's half-width inside the overlay, exactly as
# `points.hit_tolerance` is added to a marker's.
#
# THE TAP'S NUMBER AND NOT THE CROSSHAIR'S. 22 is a thumb, and this is a thumb
# gesture; `pick.snap_tolerance` is 12 because a pick is a map steered under a
# crosshair the rider can place exactly, and nothing about a long press is
# exact. A route's diamonds are also smaller than a point's marker, so the
# wider margin is doing more work here than it does over there.
drag_hit_tolerance = 22

# HOW LONG THE PRESS IS HELD before it grabs, in seconds.
#
# THE ONE DIAL THIS GESTURE REALLY HAS. The hold is the whole negotiation
# between grabbing a waypoint and panning the chart, and the two are separated
# by TIME rather than by an arbitration rule: a press that stays still for this
# long is an edit, and a finger that moves before it is a pan. Shorten it and a
# rider who pauses to think before panning starts moving their route; lengthen
# it and the grab feels broken. 0.5 is UIKit's own number and is where this
# starts. 0 or less restores it.
drag_hold_seconds = 0.5

# HOW LONG A REPLAN MAY TAKE, in milliseconds, before the rest of that drag
# stops following roads and shows straight legs instead.
#
# The legs are re-followed on EVERY move, so what the rider drags is what they
# are going to get rather than a straight line that snaps to roads when they
# let go. On Kiawah a plan is a few milliseconds — about what P18's overlay
# pass costs — so this is nearly free. On a graph where it is not, a drag that
# stutters is worse than one that shows straight legs, so the FIRST move that
# overruns turns live following off for the remainder of that drag; it comes
# back on the next drag, because the cost is a property of where the route is.
#
# The release replans regardless, whatever the drag showed. 0 means never
# follow live, which is the desktop editor's own behaviour.
drag_replan_budget_ms = 30

[movingmap]
# Startup state, and the requirement in three lines: an ownship is DRAWN as
# soon as a fix arrives, and the map does not move until the user presses
# the GPS button (P7 turns these on and the second press turns them back
# off). MM4 reads these as startup state only.
auto_center = false
auto_rotate = false
continuous = false

# THE COMPASS (P9). Which way is up when the map is following: course-up
# (the chart turns so the way ahead is up the screen) or north-up. ON is the
# requirement's own startup — "clicking gps button immediately centers on
# current location and auto-rotates" — and the compass in the top right is
# how a rider says otherwise. Startup state, like the three above: the mode
# is remembered for the session and not written anywhere.
course_up = true

# HOW THE MAP ARRIVES, in seconds. Two numbers, because course-up and
# north-up want opposite animations and Chris asked for exactly that ("in
# course-up I want to continuously center and orient the map, without the lag
# we have today; in north-up the current lag is good").
#
# `slew_s` is the ordinary one — a recentre seconds away from the last one,
# eased in and out. It is fvkit's own default and what north-up follow, the
# exit-to-north unwind and the compass's own tap all use.
slew_s = 0.35

# `follow_slew_*` is course-up's, where a target arrives on EVERY fix. The
# animation is linear there (an ease restarted every second never leaves its
# own slow opening — MM3's header says so in as many words) and its duration
# is one FIX INTERVAL, which is measured rather than set: a phone reports at
# 1 Hz and the demo feed at `demo_time_scale` times its recorded schedule, so
# no constant is right for both. These three shape that measurement —
# `follow_slew_s` is the estimate before anything has been measured and after
# a gap, and the other two are the band it is clamped to.
#
# Shorter than the true interval and the map lunges and then stands still,
# once a second. Longer and it is still travelling toward the last fix when
# the next one retargets it, which is the lag wearing a smaller hat. Equal is
# the whole point: the chart slides at the rider's own speed.
follow_slew_s = 1.0
follow_slew_min_s = 0.2
follow_slew_max_s = 2.0

# Snap to road is OFF at startup and P7 turns it on with GPS mode: the graph
# is bundled, so the snapper has something to snap to, but a parked phone
# being dragged onto a road it is not on is worse than no snapping at all.
snap_to_road = false

# The ownship's symbol and its size (P4). `fv.ownship` is G2's aircraft in
# plan view and `fv.north` is the generic chevron — a bike is not an
# aircraft, so the chevron is the default and the aeroplane is one key away.
# The size is in AUTHORED pixels, which PPMap turns into iOS points through
# GeoDraw's symbol_dpi_scale — so it is a physical size on any screen. Note
# that `fv.north` is drawn LARGER than the shape box along its axis (it is map
# furniture, not a marker): 1.30 of it each way, so 20 here is a chevron about
# 26 points long and 19 across. `fv.ownship` fits its box exactly, and would
# want 24.
#
# 20 AND NOT 14 SINCE 2026-09-02, and the two numbers moved together: the
# chevron was reshaped from a 4-to-1 needle to an arrow with the proportions
# of the `location.fill` glyph on the GPS button, which shortened it from 4.00
# of the shape box to 2.60. 14 kept its old length; 20 keeps the mark the size
# it looked on the phone.
symbol = "fv.north"
size_px = 20

# The demo feed (`Pippin -PPDemoFeed YES`): the real 28-minute Kiawah ride,
# replayed through the same ScriptedSource path a recorded NMEA log would
# take. It exists so the ownship can be seen on a phone that is nowhere near
# the island, and so the simulator does not need a location scheme to show
# something moving.
#
# THE TRACK IS NOT IN A RELEASE PACK, and this key still names it there. The
# flag is `#if DEBUG` and `stage_data.py --release` leaves the .gpx out, so in
# a shipping build nothing reads this and the dangling name costs nothing —
# `--release` skips it in the pack's own path check for that reason. One
# tracked settings file for both packs is worth more than two that drift.
#
# time_scale is the demo's own knob, and 4 is the default because a demo is
# not a ride: the SOURCE still replays the recorded schedule exactly (MM6's
# property — the fixes' own stamps are the clock), and this multiplies it, so
# 28 minutes of Kiawah becomes seven. Set it to 1.0 for the real pace.
# loop is on so a demo left running does not stop —
# at the price of one jump per lap, because this ride is not a closed circuit
# (it ends about 5.5 km from where it starts).
demo_track = "kiawah_cycle.gpx"
demo_time_scale = 4.0
demo_loop = true

[display]
# THE RASTER CACHE (P18). The base map is drawn into a surface LARGER than
# the screen and kept; the overlays (route, points, ownship) are drawn every
# frame on their own transparent surface; and the display composites the two.
# So a camera that has only moved a little is served pixels nobody
# re-rasterized, which is what makes a moving map cost an overlay pass
# instead of a whole vector render.
#
# base_cache_band_margin is the fraction of the screen added on EACH side, so
# 0.25 is a canvas half again as large in each axis and 2.25x the pixels —
# about 800 m of riding absorbed at riding scale on a phone-sized screen.
#
# IT CUTS BOTH WAYS AND THAT IS WHY IT IS A KNOB. A bigger band absorbs a
# faster pan and makes every MISS more expensive, because a miss rasterizes
# the whole band. The shell already refuses to pay for one where every frame
# is known to miss (a pinch, and the first frame of a launch), so what is
# left is a straight memory-and-miss-cost versus hit-rate trade. 0 turns the
# band off without turning the cache off: a camera that has not moved at all
# is still served, which is every fix that arrives while the map is still.
base_cache_band_margin = 0.25

# How far the chart may turn under a composited base map before it is drawn
# again, in degrees. A QUALITY limit and not a coverage one — the band holds
# the pixels for a much bigger angle, but every degree of turn is resampled
# by the compositor, and a map is the one thing on this screen nobody wants
# softened. Course-up spends this on every fix; 0 makes every turn a redraw.
base_cache_max_turn_deg = 2.5

# THE SYMBOL SIZE THE MENU OFFERS (P22), smallest first, as multipliers on
# everything the style authors in pixels — line widths, text, halos, icons and
# an area pattern's pitch. The first step is the map as authored and the menu
# calls it Small; the rest are the larger ones, named Medium and Large.
#
# IT IS NOT THE MAP SCALE. This grows the symbology and leaves the ground
# alone, which is PythonView's `[`/`]` and not its `-`/`=`; a pinch is still
# the way to see more or less island. Implemented as the device DPI the style
# engine is told about, so one number moves all of it together — see
# `PPMap.symbolZoom`.
#
# A rider who wants a bolder map on a bright day changes these rather than a
# build. Any number of steps is legal; the names run out after three and the
# menu falls back to printing the multiplier.
symbol_zoom_steps = 1.0, 1.35, 1.75
